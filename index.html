<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ahmet Barber</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #0b0b0b;
            color: #ffffff;
            min-height: 100vh;
        }

        .page {
            width: 100%;
            max-width: 430px;
            margin: auto;
            min-height: 100vh;
            padding: 30px 18px 25px;
        }

        /* ÜST BÖLÜM */

        .profile {
            text-align: center;
            padding-top: 15px;
            margin-bottom: 25px;
        }

        .profile-image {
            width: 105px;
            height: 105px;
            border-radius: 50%;
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: center;

            background: #1c1c1c;
            border: 2px solid #333;

            font-size: 45px;

            box-shadow: 0 8px 30px rgba(0,0,0,0.4);
        }

        .business-name {
            font-size: 28px;
            font-weight: 700;
            margin-top: 17px;
        }

        .verified {
            color: #aaa;
            font-size: 14px;
            margin-left: 4px;
        }

        .category {
            color: #999;
            margin-top: 7px;
            font-size: 15px;
        }

        .rating {
            margin-top: 12px;
            font-size: 14px;
            color: #ddd;
        }

        .stars {
            color: #f5c542;
        }

        /* BUTONLAR */

        .buttons {
            display: flex;
            flex-direction: column;
            gap: 13px;
        }

        .button {
            width: 100%;
            min-height: 58px;

            display: flex;
            align-items: center;

            padding: 0 20px;

            background: #191919;
            border: 1px solid #303030;
            border-radius: 15px;

            text-decoration: none;
            color: white;

            font-size: 16px;
            font-weight: 600;

            transition: 0.2s ease;

            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        .button:hover {
            background: #222;
            transform: translateY(-2px);
            border-color: #444;
        }

        .button:active {
            transform: scale(0.98);
        }

        .icon {
            width: 35px;
            font-size: 21px;
        }

        .button-text {
            flex: 1;
            text-align: center;
            margin-right: 35px;
        }

        /* ÖNE ÇIKAN BUTON */

        .appointment {
            background: #ffffff;
            color: #111;
            border-color: #ffffff;
        }

        .appointment:hover {
            background: #e9e9e9;
            border-color: #e9e9e9;
        }

        /* BİLGİ KARTI */

        .info {
            margin-top: 25px;
            padding: 18px;

            background: #151515;
            border: 1px solid #292929;
            border-radius: 15px;

            text-align: left;
        }

        .info-title {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .info-text {
            color: #999;
            font-size: 14px;
            line-height: 1.5;
        }

        /* ALT */

        .footer {
            text-align: center;
            margin-top: 35px;
            color: #555;
            font-size: 12px;
        }

        .tapgo {
            color: #888;
            font-weight: bold;
            letter-spacing: 1px;
        }
    </style>
</head>

<body>

<div class="page">

    <!-- İŞLETME PROFİLİ -->

    <div class="profile">

        <div class="profile-image">
            ✂️
        </div>

        <div class="business-name">
            Ahmet Barber
            <span class="verified">✓</span>
        </div>

        <div class="category">
            Erkek Kuaförü • Ankara
        </div>

        <div class="rating">
            <span class="stars">★★★★★</span>
            4.9 • 127 değerlendirme
        </div>

    </div>


    <!-- BUTONLAR -->

    <div class="buttons">

        <a class="button appointment"
           href="https://wa.me/905555555555"
           target="_blank">

            <div class="icon">💬</div>

            <div class="button-text">
                WhatsApp'tan Randevu
            </div>

        </a>


        <a class="button"
           href="https://www.instagram.com/"
           target="_blank">

            <div class="icon">📸</div>

            <div class="button-text">
                Instagram
            </div>

        </a>


        <a class="button"
           href="https://www.google.com/maps"
           target="_blank">

            <div class="icon">📍</div>

            <div class="button-text">
                Yol Tarifi
            </div>

        </a>


        <a class="button"
           href="https://www.google.com/"
           target="_blank">

            <div class="icon">⭐</div>

            <div class="button-text">
                Google'da Değerlendir
            </div>

        </a>

    </div>


    <!-- İŞLETME BİLGİSİ -->

    <div class="info">

        <div class="info-title">
            📍 İşletme Bilgileri
        </div>

        <div class="info-text">
            Ankara / Altındağ<br>
            Pazartesi - Cumartesi<br>
            09:00 - 20:00
        </div>

    </div>


    <!-- FOOTER -->

    <div class="footer">

        <div class="tapgo">
            TAPGO
        </div>

        Dijital işletme kartı

    </div>

</div>

</body>
</html>
