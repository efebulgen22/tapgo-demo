<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TAPGO</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #0b0b0b;
            color: white;
            min-height: 100vh;
        }

        .page {
            width: 100%;
            max-width: 430px;
            margin: auto;
            min-height: 100vh;
            padding: 30px 18px 25px;
        }

        .profile {
            text-align: center;
            padding-top: 15px;
            margin-bottom: 25px;
        }

        .profile-image {
            width: 105px;
            height: 105px;
            border-radius: 50%;
            margin: auto;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #1c1c1c;
            border: 2px solid #333;

            font-size: 45px;
        }

        .business-name {
            font-size: 28px;
            font-weight: 700;
            margin-top: 17px;
        }

        .category {
            color: #999;
            margin-top: 7px;
            font-size: 15px;
        }

        .rating {
            margin-top: 12px;
            font-size: 14px;
            color: #ddd;
        }

        .stars {
            color: #f5c542;
        }

        .buttons {
            display: flex;
            flex-direction: column;
            gap: 13px;
        }

        .button {
            width: 100%;
            min-height: 58px;

            display: flex;
            align-items: center;

            padding: 0 20px;

            background: #191919;
            border: 1px solid #303030;
            border-radius: 15px;

            text-decoration: none;
            color: white;

            font-size: 16px;
            font-weight: 600;

            transition: 0.2s ease;
        }

        .button:hover {
            background: #222;
            transform: translateY(-2px);
        }

        .icon {
            width: 35px;
            font-size: 21px;
        }

        .button-text {
            flex: 1;
            text-align: center;
            margin-right: 35px;
        }

        .appointment {
            background: white;
            color: #111;
            border-color: white;
        }

        .info {
            margin-top: 25px;
            padding: 18px;

            background: #151515;
            border: 1px solid #292929;
            border-radius: 15px;

            text-align: left;
        }

        .info-title {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .info-text {
            color: #999;
            font-size: 14px;
            line-height: 1.6;
        }

        .footer {
            text-align: center;
            margin-top: 35px;
            color: #555;
            font-size: 12px;
        }

        .tapgo {
            color: #888;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 5px;
        }

        .error {
            text-align: center;
            padding-top: 100px;
        }

        .error h1 {
            margin-bottom: 10px;
        }

        .error p {
            color: #888;
        }
    </style>
</head>

<body>

<div class="page" id="app"></div>


<script>

    /*
    ==========================================
             TAPGO MÜŞTERİ VERİLERİ
    ==========================================
    */

    const customers = {

        ahmetbarber: {

            name: "Ahmet Barber",

            category: "Erkek Kuaförü",

            city: "Ankara / Altındağ",

            logo: "✂️",

            instagram:
                "https://www.instagram.com/",

            whatsapp:
                "https://wa.me/905555555555",

            maps:
                "https://www.google.com/maps",

            google:
                "https://www.google.com/",

            rating: "Demo",

            reviews: "Demo",

            hours:
                "Pazartesi - Cumartesi<br>09:00 - 20:00"

        },


        efecoffee: {

            name: "Efe Coffee",

            category: "Kafe & Kahve",

            city: "Ankara",

            logo: "☕",

            instagram:
                "https://www.instagram.com/",

            whatsapp:
                "https://wa.me/905555555555",

            maps:
                "https://www.google.com/maps",

            google:
                "https://www.google.com/",

            rating: "Demo",

            reviews: "Demo",

            hours:
                "Her gün<br>08:00 - 23:00"

        }

    };


    /*
    ==========================================
                 URL'DEN ID AL
    ==========================================
    */

    const params =
        new URLSearchParams(window.location.search);

    const id =
        params.get("id");


    /*
    ==========================================
              MÜŞTERİYİ BUL
    ==========================================
    */

    const customer =
        customers[id];


    /*
    ==========================================
                 SAYFAYI OLUŞTUR
    ==========================================
    */

    const app =
        document.getElementById("app");


    if (!customer) {

        app.innerHTML = `

            <div class="error">

                <h1>İşletme bulunamadı</h1>

                <p>
                    Geçersiz veya eksik TAPGO bağlantısı.
                </p>

            </div>

        `;

    } else {

        document.title =
            customer.name + " | TAPGO";


        app.innerHTML = `

            <div class="profile">

                <div class="profile-image">

                    ${customer.logo}

                </div>


                <div class="business-name">

                    ${customer.name}

                </div>


                <div class="category">

                    ${customer.category}
                    •
                    ${customer.city}

                </div>


                <div class="rating">

                    ${customer.rating}

                    ${customer.reviews !== "Demo"
                        ? " • " + customer.reviews + " değerlendirme"
                        : ""
                    }

                </div>

            </div>


            <div class="buttons">


                <a class="button appointment"
                   href="${customer.whatsapp}"
                   target="_blank">

                    <div class="icon">
                        💬
                    </div>

                    <div class="button-text">
                        WhatsApp'tan İletişim
                    </div>

                </a>


                <a class="button"
                   href="${customer.instagram}"
                   target="_blank">

                    <div class="icon">
                        📸
                    </div>

                    <div class="button-text">
                        Instagram
                    </div>

                </a>


                <a class="button"
                   href="${customer.maps}"
                   target="_blank">

                    <div class="icon">
                        📍
                    </div>

                    <div class="button-text">
                        Yol Tarifi
                    </div>

                </a>


                <a class="button"
                   href="${customer.google}"
                   target="_blank">

                    <div class="icon">
                        ⭐
                    </div>

                    <div class="button-text">
                        Google'da Değerlendir
                    </div>

                </a>


            </div>


            <div class="info">

                <div class="info-title">

                    📍 İşletme Bilgileri

                </div>


                <div class="info-text">

                    ${customer.city}

                    <br>

                    ${customer.hours}

                </div>

            </div>


            <div class="footer">

                <div class="tapgo">
                    TAPGO
                </div>

                Dijital işletme kartı

            </div>

        `;

    }

</script>

</body>
</html>
