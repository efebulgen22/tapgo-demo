<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>TAPGO</title>


<style>

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}


body {

  font-family: Arial, Helvetica, sans-serif;

  background: #0b0b0b;

  color: white;

  min-height: 100vh;

  display: flex;

  justify-content: center;

}


.container {

  width: 100%;

  max-width: 430px;

  min-height: 100vh;

  padding: 30px 20px;

  display: flex;

  flex-direction: column;

}


.profile {

  text-align: center;

  margin-top: 25px;

}


.logo {

  width: 90px;

  height: 90px;

  border-radius: 50%;

  background: #171717;

  border: 1px solid #292929;

  display: flex;

  align-items: center;

  justify-content: center;

  margin: 0 auto 18px;

  font-size: 40px;

  overflow: hidden;

}


.logo img {

  width: 100%;

  height: 100%;

  object-fit: cover;

}


.name {

  font-size: 28px;

  font-weight: 700;

}


.category {

  margin-top: 7px;

  color: #999;

  font-size: 15px;

}


.city {

  margin-top: 5px;

  color: #777;

  font-size: 14px;

}


.buttons {

  margin-top: 35px;

  display: flex;

  flex-direction: column;

  gap: 12px;

}


.btn {

  width: 100%;

  padding: 17px;

  border-radius: 14px;

  background: #171717;

  border: 1px solid #292929;

  color: white;

  text-decoration: none;

  text-align: center;

  font-size: 16px;

  font-weight: 600;

}


.whatsapp {

  background: #18a957;

  border-color: #18a957;

}


.info {

  margin-top: 28px;

  background: #111;

  border: 1px solid #242424;

  border-radius: 16px;

  overflow: hidden;

}


.info-row {

  padding: 16px;

  border-bottom: 1px solid #222;

  font-size: 14px;

  color: #aaa;

}


.info-row:last-child {

  border-bottom: none;

}


.info-title {

  color: white;

  font-weight: 600;

  margin-bottom: 5px;

}


.loading {

  text-align: center;

  margin-top: 100px;

  color: #777;

}


.error {

  text-align: center;

  margin-top: 100px;

  color: #ff5c5c;

}


footer {

  margin-top: auto;

  padding-top: 35px;

  text-align: center;

  color: #555;

  font-size: 12px;

}

</style>

</head>


<body>


<div class="container">


  <div id="loading"
       class="loading">

    Yükleniyor...

  </div>


  <div id="content"
       style="display:none;">


    <div class="profile">


      <div id="logo"
           class="logo">

        ✂️

      </div>


      <div id="name"
           class="name">

        İşletme

      </div>


      <div id="category"
           class="category">

        -

      </div>


      <div id="city"
           class="city">

        -

      </div>


    </div>


    <div class="buttons">


      <a id="whatsapp"
         class="btn whatsapp"
         target="_blank">

        💬 WhatsApp

      </a>


      <a id="instagram"
         class="btn"
         target="_blank">

        📷 Instagram

      </a>


      <a id="maps"
         class="btn"
         target="_blank">

        📍 Konum

      </a>


      <a id="google"
         class="btn"
         target="_blank">

        ⭐ Google'da Değerlendir

      </a>


    </div>


    <div class="info">


      <div class="info-row">

        <div class="info-title">

          📍 Konum

        </div>

        <div id="cityInfo">

          -

        </div>

      </div>


      <div class="info-row">

        <div class="info-title">

          🕐 Çalışma Saatleri

        </div>

        <div id="hours">

          -

        </div>

      </div>


    </div>


    <footer>

      TAPGO · Dijital İşletme Standı

    </footer>


  </div>


  <div id="error"
       class="error"
       style="display:none;">

    İşletme bulunamadı.

  </div>


</div>



<script>


const API_URL =
"https://script.google.com/macros/s/AKfycbzYoGK5hM6WtaydubGiyJPhblkoGWwiVS5tEBWCHcurhklNytcKtkH57Ml6A5z89rLO6w/exec";


const params =
new URLSearchParams(
  window.location.search
);


const id =
params.get("id");


if (!id) {

  document.getElementById(
    "loading"
  ).style.display = "none";


  document.getElementById(
    "error"
  ).style.display = "block";

}


else {

  fetch(
    API_URL +
    "?id=" +
    encodeURIComponent(id)
  )

  .then(
    response => response.json()
  )

  .then(
    data => {


      document.getElementById(
        "loading"
      ).style.display = "none";


      if (!data.success) {

        document.getElementById(
          "error"
        ).style.display = "block";

        return;

      }


      document.getElementById(
        "content"
      ).style.display = "block";


      const customer =
        data.customer;


      document.getElementById(
        "name"
      ).textContent =
        customer.name || "İşletme";


      document.getElementById(
        "category"
      ).textContent =
        customer.category || "";


      document.getElementById(
        "city"
      ).textContent =
        customer.city || "";


      document.getElementById(
        "cityInfo"
      ).textContent =
        customer.city || "-";


      document.getElementById(
        "hours"
      ).textContent =
        customer.hours || "-";


      const logo =
        document.getElementById("logo");


      if (customer.logo) {


        if (
          String(customer.logo)
            .startsWith("http")
        ) {

          logo.innerHTML =
            '<img src="' +
            customer.logo +
            '" alt="Logo">';

        }

        else {

          logo.textContent =
            customer.logo;

        }

      }


      setupButton(
        "whatsapp",
        customer.whatsapp
      );


      setupButton(
        "instagram",
        customer.instagram
      );


      setupButton(
        "maps",
        customer.maps
      );


      setupButton(
        "google",
        customer.google
      );


    }

  )

  .catch(

    error => {

      console.error(error);


      document.getElementById(
        "loading"
      ).style.display =
        "none";


      document.getElementById(
        "error"
      ).style.display =
        "block";

    }

  );

}



function setupButton(
  id,
  url
) {

  const button =
    document.getElementById(id);


  if (!url) {

    button.style.display =
      "none";

    return;

  }


  button.href = url;

}

</script>


</body>

</html>
