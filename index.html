<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ahmet Barber</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
            min-height: 100vh;
        }

        .container {
            max-width: 430px;
            min-height: 100vh;
            margin: auto;
            padding: 45px 22px 25px;
            text-align: center;
        }

        .logo {
            width: 90px;
            height: 90px;
            margin: auto;
            margin-bottom: 20px;
            border-radius: 50%;
            background: #222;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 38px;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 8px;
        }

        .description {
            color: #aaa;
            margin-bottom: 30px;
        }

        .button {
            display: block;
            width: 100%;
            padding: 17px;
            margin: 12px 0;
            border-radius: 14px;
            background: #222;
            border: 1px solid #333;
            color: white;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
        }

        .button:active {
            transform: scale(0.98);
        }

        .footer {
            margin-top: 45px;
            color: #666;
            font-size: 12px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="logo">✂️</div>

    <h1>Ahmet Barber</h1>

    <p class="description">
        Erkek Kuaförü • Ankara
    </p>

    <a class="button"
       href="https://www.instagram.com/"
       target="_blank">
        📷 Instagram
    </a>

    <a class="button"
       href="https://wa.me/905555555555"
       target="_blank">
        💬 WhatsApp'tan Randevu
    </a>

    <a class="button"
       href="https://www.google.com/maps"
       target="_blank">
        📍 Yol Tarifi
    </a>

    <a class="button"
       href="https://www.google.com/"
       target="_blank">
        ⭐ Google'da Değerlendir
    </a>

    <div class="footer">
        Dijital işletme sistemi • TAPGO
    </div>

</div>

</body>
</html>
