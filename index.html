<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TAPGO</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

    background:
        radial-gradient(
            circle at top,
            #202024 0%,
            #0b0b0d 45%
        );

    color: #ffffff;
    min-height: 100vh;
}

.container {
    width: 100%;
    max-width: 440px;
    margin: auto;
    padding: 25px 16px 35px;
}

/* ANA KART */

.card {
    background: rgba(21, 21, 24, 0.96);

    border: 1px solid rgba(255,255,255,0.09);

    border-radius: 28px;

    padding: 28px 20px 22px;

    box-shadow:
        0 25px 70px rgba(0,0,0,0.45);

    backdrop-filter: blur(15px);
}

/* LOGO */

.logo {
    width: 92px;
    height: 92px;

    margin: 0 auto 18px;

    border-radius: 50%;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #242428;

    border: 1px solid rgba(255,255,255,0.08);

    overflow: hidden;

    font-size: 42px;

    box-shadow:
        0 8px 30px rgba(0,0,0,0.3);
}

.logo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

/* İŞLETME */

.business-name {
    text-align: center;

    font-size: 28px;

    font-weight: 750;

    letter-spacing: -0.5px;

    margin-bottom: 7px;
}

.category {
    text-align: center;

    color: #b1b1b8;

    font-size: 14px;

    margin-bottom: 5px;
}

.city {
    text-align: center;

    color: #77777f;

    font-size: 13px;

    margin-bottom: 24px;
}

/* BUTONLAR */

.buttons {
    display: flex;
    flex-direction: column;

    gap: 11px;
}

.button {
    width: 100%;

    display: flex;
    align-items: center;
    justify-content: center;

    min-height: 54px;

    padding: 14px 16px;

    border-radius: 15px;

    text-decoration: none;

    color: white;

    background: #202024;

    border: 1px solid #303037;

    font-size: 15px;

    font-weight: 650;

    transition:
        transform 0.18s ease,
        background 0.18s ease,
        border-color 0.18s ease;
}

.button:hover {
    transform: translateY(-2px);

    background: #29292f;

    border-color: #414149;
}

.button:active {
    transform: scale(0.98);
}

/* WHATSAPP */

.whatsapp {
    background: #16834f;

    border-color: #1c9c60;
}

.whatsapp:hover {
    background: #1b965b;

    border-color: #25b875;
}

/* BUTON İKON */

.icon {
    margin-right: 9px;

    font-size: 17px;
}

/* BİLGİLER */

.info {
    margin-top: 25px;

    padding-top: 22px;

    border-top:
        1px solid rgba(255,255,255,0.08);
}

.info-title {
    font-size: 14px;

    font-weight: 700;

    margin-bottom: 13px;
}

.info-row {
    display: flex;

    align-items: flex-start;

    justify-content: space-between;

    gap: 15px;

    padding: 9px 0;

    color: #9999a1;

    font-size: 13px;
}

.info-row strong {
    color: #eeeeef;

    font-weight: 500;

    text-align: right;

    line-height: 1.4;
}

/* FOOTER */

.footer {
    text-align: center;

    margin-top: 20px;

    color: #55555d;

    font-size: 10px;

    letter-spacing: 2px;
}

.footer span {
    color: #777780;
}

/* YÜKLENİYOR */

.loading {
    text-align: center;

    padding: 70px 20px;

    color: #9999a1;

    font-size: 14px;
}

/* HATA */

.error {
    text-align: center;

    padding: 65px 25px;
}

.error-icon {
    font-size: 40px;

    margin-bottom: 18px;
}

.error h2 {
    font-size: 22px;

    margin-bottom: 10px;
}

.error p {
    color: #8e8e96;

    font-size: 14px;

    line-height: 1.6;
}

@media (max-width: 380px) {

    .container {
        padding: 15px 12px 25px;
    }

    .card {
        padding: 24px 16px 20px;
    }

    .business-name {
        font-size: 25px;
    }

}

</style>
</head>

<body>

<div class="container">

    <!-- YÜKLENİYOR -->

    <div id="loading" class="loading">
        İşletme bilgileri yükleniyor...
    </div>


    <!-- HATA -->

    <div id="error" class="error" style="display:none;">

        <div class="error-icon">
            🔎
        </div>

        <h2>
            İşletme bulunamadı
        </h2>

        <p id="errorText">
            Bu bağlantıya ait işletme bilgisi bulunamadı.
        </p>

    </div>


    <!-- İŞLETME -->

    <div id="businessCard"
         class="card"
         style="display:none;">

        <!-- LOGO -->

        <div class="logo" id="logo">
            ✂️
        </div>


        <!-- İSİM -->

        <div
            class="business-name"
            id="businessName">

            İşletme

        </div>


        <!-- KATEGORİ -->

        <div
            class="category"
            id="category">

            Kategori

        </div>


        <!-- ŞEHİR -->

        <div
            class="city"
            id="city">

            Şehir

        </div>


        <!-- BUTONLAR -->

        <div class="buttons">


            <!-- WHATSAPP -->

            <a
                id="whatsapp"
                class="button whatsapp"
                href="#"
                target="_blank"
                rel="noopener"
                style="display:none;">

                <span class="icon">
                    💬
                </span>

                WhatsApp'tan İletişime Geç

            </a>


            <!-- INSTAGRAM -->

            <a
                id="instagram"
                class="button"
                href="#"
                target="_blank"
                rel="noopener"
                style="display:none;">

                <span class="icon">
                    📸
                </span>

                Instagram

            </a>


            <!-- MAPS -->

            <a
                id="maps"
                class="button"
                href="#"
                target="_blank"
                rel="noopener"
                style="display:none;">

                <span class="icon">
                    📍
                </span>

                Yol Tarifi Al

            </a>


            <!-- GOOGLE -->

            <a
                id="google"
                class="button"
                href="#"
                target="_blank"
                rel="noopener"
                style="display:none;">

                <span class="icon">
                    ⭐
                </span>

                Google'da Değerlendir

            </a>


        </div>


        <!-- İŞLETME BİLGİLERİ -->

        <div class="info">

            <div class="info-title">
                İşletme Bilgileri
            </div>


            <div class="info-row">

                <span>
                    📍 Konum
                </span>

                <strong id="infoCity">
                    -
                </strong>

            </div>


            <div class="info-row">

                <span>
                    🕒 Çalışma Saatleri
                </span>

                <strong id="hours">
                    -
                </strong>

            </div>

        </div>

    </div>


    <!-- FOOTER -->

    <div class="footer">

        <span>TAPGO</span>
        &nbsp;•&nbsp;
        DİJİTAL İŞLETME STANDI

    </div>

</div>


<script>


/*
===========================================
TAPGO API
===========================================
*/

const API_URL =
"https://script.google.com/macros/s/AKfycbzYoGK5hM6WtaydubGiyJPhblkoGWwiVS5tEBWCHcurhklNytcKtkH57Ml6A5z89rLO6w/exec";


/*
===========================================
URL'DEN ID AL
===========================================
*/

const params =
    new URLSearchParams(window.location.search);

const id =
    params.get("id");


/*
===========================================
HTML ELEMANLARI
===========================================
*/

const loading =
    document.getElementById("loading");

const errorBox =
    document.getElementById("error");

const errorText =
    document.getElementById("errorText");

const businessCard =
    document.getElementById("businessCard");


/*
===========================================
ID KONTROL
===========================================
*/

if (!id) {

    loading.style.display = "none";

    errorBox.style.display = "block";

    errorText.innerText =
        "Bu bağlantıda işletme ID'si bulunmuyor.";

} else {

    loadBusiness();

}


/*
===========================================
İŞLETMEYİ GETİR
===========================================
*/

async function loadBusiness() {

    try {

        const response =
            await fetch(
                API_URL +
                "?id=" +
                encodeURIComponent(id)
            );


        if (!response.ok) {

            throw new Error(
                "Sunucuya bağlanılamadı."
            );

        }


        const data =
            await response.json();


        console.log(
            "TAPGO API:",
            data
        );


        if (
            !data.success ||
            !data.customer
        ) {

            throw new Error(
                data.error ||
                "İşletme bulunamadı."
            );

        }


        const customer =
            data.customer;


        /*
        ===================================
        TEMEL BİLGİLER
        ===================================
        */

        document.getElementById(
            "businessName"
        ).innerText =
            customer.name ||
            "İşletme";


        document.getElementById(
            "category"
        ).innerText =
            customer.category ||
            "";


        document.getElementById(
            "city"
        ).innerText =
            customer.city ||
            "";


        document.getElementById(
            "infoCity"
        ).innerText =
            customer.city ||
            "-";


        document.getElementById(
            "hours"
        ).innerText =
            customer.hours ||
            "-";


        /*
        ===================================
        LOGO
        ===================================
        */

        const logo =
            document.getElementById("logo");


        if (customer.logo) {

            const logoValue =
                String(customer.logo);


            if (
                logoValue.startsWith("http://") ||
                logoValue.startsWith("https://")
            ) {

                logo.innerHTML =
                    "";


                const image =
                    document.createElement("img");


                image.src =
                    logoValue;


                image.alt =
                    customer.name ||
                    "İşletme logosu";


                logo.appendChild(
                    image
                );


            } else {

                logo.innerText =
                    logoValue;

            }

        }


        /*
        ===================================
        WHATSAPP
        ===================================
        */

        setupButton(
            "whatsapp",
            customer.whatsapp
        );


        /*
        ===================================
        INSTAGRAM
        ===================================
        */

        setupButton(
            "instagram",
            customer.instagram
        );


        /*
        ===================================
        MAPS
        ===================================
        */

        setupButton(
            "maps",
            customer.maps
        );


        /*
        ===================================
        GOOGLE
        ===================================
        */

        setupButton(
            "google",
            customer.google
        );


        /*
        ===================================
        SAYFAYI GÖSTER
        ===================================
        */

        loading.style.display =
            "none";

        businessCard.style.display =
            "block";


        /*
        ===================================
        SAYFA BAŞLIĞI
        ===================================
        */

        document.title =
            (customer.name ||
            "TAPGO") +
            " | TAPGO";


    } catch (error) {

        console.error(
            "TAPGO Hatası:",
            error
        );


        loading.style.display =
            "none";


        errorBox.style.display =
            "block";


        errorText.innerText =
            "İşletme bilgileri yüklenirken bir hata oluştu.";

    }

}


/*
===========================================
BUTON AYARLA
===========================================
*/

function setupButton(
    elementId,
    url
) {

    const button =
        document.getElementById(
            elementId
        );


    if (
        url &&
        String(url).trim() !== ""
    ) {

        button.href =
            String(url).trim();

        button.style.display =
            "flex";

    }

}

</script>

</body>
</html>
