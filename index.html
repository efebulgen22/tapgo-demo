<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ahmet Barber</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #111111;
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 430px;
            min-height: 100vh;
            padding: 40px 22px 25px;
            text-align: center;
        }

        .logo {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: #222;
            margin: 0 auto 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 38px;
            border: 1px solid #444;
        }

        h1 {
            font-size: 27px;
            margin-bottom: 8px;
        }

        .description {
            color: #aaa;
            margin-bottom: 30px;
            font-size: 15px;
        }

        .button {
            display: block;
            width: 100%;
            padding: 17px;
            margin: 13px 0;
            border-radius: 13px;
            text-decoration: none;
            color: white;
            background: #202020;
            border: 1px solid #333;
            font-size: 16px;
            font-weight: bold;
            transition: 0.2s;
        }

        .button:hover {
            transform: scale(1.02);
            background: #292929;
        }

        .instagram {
            background: #202020;
        }

        .whatsapp {
            background: #202020;
        }

        .footer {
            margin-top: 45px;
            color: #666;
            font-size: 12px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="logo">
        ✂️
    </div>

    <h1>TAPGOO</h1>

    <div class="description">
        Erkek Kuaförü • Ankara
    </div>

    <a class="button instagram"
       href="https://www.instagram.com/"
       target="_blank">
        📷 Instagram
    </a>

    <a class="button whatsapp"
       href="https://wa.me/905555555555"
       target="_blank">
        💬 WhatsApp'tan Randevu
    </a>

    <a class="button"
       href="https://www.google.com/maps"
       target="_blank">
        📍 Yol Tarifi
    </a>

    <a class="button"
       href="https://www.google.com/"
       target="_blank">
        ⭐ Google'da Değerlendir
    </a>

    <div class="footer">
        Dijital işletme sistemi • TAPGO
    </div>

</div>

</body>
</html>
